spring.application.name=LogInServer
spring.datasource.url=jdbc:postgresql://localhost:5432/login?charSet=UTF8
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=USERNAME
spring.datasource.password=PASSWORD

server.port=8080
server.address=0.0.0.0

springdoc.swagger-ui.oauth.client-id=
spring.security.oauth2.resourceserver.jwt.issuer-uri=
springdoc.swagger-ui.oauth.client-secret=

keycloak.admin-cli.user=
keycloak.admin-cli.password=
keycloak.admin-cli.server=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.serialization.fail-on-empty-beans=false
